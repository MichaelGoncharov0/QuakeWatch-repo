name: QuakeWatch CI

on:
  push:
    branches-ignore:
      - main

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pylint
        run: |
          python -m pip install --upgrade pip
          pip install pylint

      - name: Run pylint on Python files
        run: |
          python -m pylint --disable=import-error $(find . -type f -name "*.py" \
            ! -path "*/.git/*" \
            ! -path "*/venv/*")

      - name: Build Docker image
        run: |
          docker build -f Phase3/quakewatch-chart/Dockerfile -t quakewatch:ci .
